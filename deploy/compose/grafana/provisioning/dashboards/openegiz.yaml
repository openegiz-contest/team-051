apiVersion: 1
providers:
  - name: stepnoe
    folder: Stepnoe
    type: file
    allowUiUpdates: true
    updateIntervalSeconds: 10
    options:
      path: /var/lib/grafana/stepnoe-dashboards
  - name: openegiz
    folder: OpenEgiz
    type: file
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true
  # Filled by example overlays (examples/*/compose.yml); empty otherwise.
  - name: examples
    folder: OpenEgiz Examples
    type: file
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/example-dashboards
