# One origin for Grafana, embedded 3D, and the scenario buttons.
map $http_upgrade $stepnoe_connection {
  default upgrade;
  '' close;
}
server {
  listen 80;
  server_name _;
  # Docker DNS permits independent service restarts without stale IPs.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $grafana_backend grafana:3000;
  set $stepnoe_backend stepnoe:8000;

  location = /stepnoe/health {
    proxy_pass http://$stepnoe_backend/health;
  }

  location /stepnoe/ {
    # Require an authenticated Grafana session for UI and command access.
    auth_request /_stepnoe_auth;
    rewrite ^/stepnoe/(.*)$ /$1 break;
    proxy_pass http://$stepnoe_backend;
    proxy_set_header Host $http_host;
  }
  location = /_stepnoe_auth {
    internal;
    proxy_pass http://$grafana_backend/api/user;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Authorization $http_authorization;
  }
  location / {
    proxy_pass http://$grafana_backend;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $stepnoe_connection;
  }
}
