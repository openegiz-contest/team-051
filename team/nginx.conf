# One origin for Grafana, embedded 3D, and the scenario buttons.
map $http_upgrade $stepnoe_connection {
  default upgrade;
  '' close;
}
server {
  listen 80;
  server_name _;
  # Docker DNS permits independent service restarts without stale IPs.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $grafana_backend grafana:3000;
  set $stepnoe_backend stepnoe:8085;

  location = /stepnoe/health {
    proxy_pass http://$stepnoe_backend/health;
  }

  # API requests, including CORS preflight, go directly to Stepnoe.
  location ^~ /stepnoe/api/ {
    auth_request off;
    error_page 500 502 503 504 = @stepnoe_api_unavailable;
    rewrite ^/stepnoe(/api/.*)$ $1 break;
    proxy_pass http://$stepnoe_backend;
    proxy_set_header Host $http_host;
  }
  location @stepnoe_api_unavailable {
    default_type application/json;
    add_header Access-Control-Allow-Origin '*' always;
    add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS' always;
    add_header Access-Control-Allow-Headers 'Content-Type, X-Grafana-Org-Id' always;
    return 503 '{"error":"Stepnoe API is unavailable. Retry shortly."}';
  }

  location /stepnoe/ {
    # Page access still requires a Grafana session; API has its own route.
    auth_request /_stepnoe_auth;
    rewrite ^/stepnoe/(.*)$ /$1 break;
    proxy_pass http://$stepnoe_backend;
    proxy_set_header Host $http_host;
  }
  location = /_stepnoe_auth {
    internal;
    proxy_pass http://$grafana_backend/api/user;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    # Grafana validates browser Origin against Host for cookie-auth requests.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Authorization $http_authorization;
  }
  location / {
    proxy_pass http://$grafana_backend;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $stepnoe_connection;
  }
}
